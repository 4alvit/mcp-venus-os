# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Release pipeline
run-name: "Release ${{ inputs.channel || github.event_name }} · ${{ github.sha }}"
'on':
  push:
    branches:
      - main
  schedule:
    - cron: 51 4 * * *
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: Release channel
        options:
          - nightly
          - beta
          - rc
          - stable
        default: rc
        required: true
      version:
        type: string
        description: Base X.Y.Z (defaults to committed project version)
        required: false
      rc_tag:
        type: string
        description: 'For stable only: checked vX.Y.Z-rc.N'
        required: false
      expected_sha:
        type: string
        description: Optional exact default-branch SHA; the local CLI fills this to detect ref movement
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  scope:
    name: Change scope
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Classify documentation and build inputs
        env:
          DOCUMENTATION_PATHS: '[]'
          REQUIRED_PATHS: '[]'
          FORCE_FULL: 'true'
        run: |
          args=()
          if [[ "$FORCE_FULL" == true ]]; then args+=(--force); fi
          python3 scripts/change_scope.py "${args[@]}" --documentation-paths-json "$DOCUMENTATION_PATHS" --required-paths-json "$REQUIRED_PATHS"
  prepare:
    needs: scope
    if: ${{ needs.scope.outputs.run == 'true' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      status: ${{ steps.metadata.outputs.status }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: metadata
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          default = event['repository']['default_branch']
          if os.environ['GITHUB_REF'] != 'refs/heads/' + default:
              raise SystemExit('Release pipeline must run from the default branch')
          inputs = event.get('inputs') or {}
          if inputs.get('expected_sha') and inputs['expected_sha'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Default branch changed since the local release request; refresh and retry')
          kind = os.environ['GITHUB_EVENT_NAME']
          channel = 'nightly' if kind == 'schedule' else ('beta' if kind == 'push' else inputs.get('channel', ''))
          if channel not in {'nightly', 'beta', 'rc', 'stable'}:
              raise SystemExit('Invalid release channel')
          if kind == 'workflow_dispatch' and channel != 'nightly' and os.environ.get('PUBLICATION_ENABLED') != 'true':
              raise SystemExit('Enable RELEASE_CHANNELS_ENABLED only after release protections and deployment hooks are migrated')
          config = json.load(open('.release-policy.json'))
          if config.get('mode', 'release') != 'release':
              raise SystemExit('This repository policy does not permit releases')
          if config.get('release_blockers'):
              raise SystemExit('Release blocked: ' + '; '.join(config['release_blockers']))
          version = ''
          if channel != 'stable':
              version = subprocess.check_output(['python3', 'scripts/release.py', 'resolve', '--version', inputs.get('version', '')], text=True).strip()
          elif kind != 'workflow_dispatch':
              raise SystemExit('Stable requires manual workflow_dispatch')
          if channel in {'rc', 'stable'} and config.get('stable_blockers'):
              raise SystemExit('Stable blocked: ' + '; '.join(config['stable_blockers']))
          import sys
          sys.path.insert(0, 'scripts')
          import release_control as rc
          closed = rc.closed_push_cycle(rc.GitHub(os.environ['GITHUB_REPOSITORY']), version, kind) if kind == 'push' else None
          if closed:
              rc.emit_result(closed)
              raise SystemExit(0)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'channel={channel}\nversion={version}\nbuild={str(channel != "stable").lower()}\n')
          PY
        env:
          PUBLICATION_ENABLED: ${{ vars.RELEASE_CHANNELS_ENABLED }}
          GH_TOKEN: ${{ github.token }}
  checks:
    needs: prepare
    if: ${{ needs.prepare.outputs.channel != 'stable' }}
    uses: ./.github/workflows/quality-gate.yml
    with:
      force-full: true
    permissions:
      contents: read
      actions: read
      security-events: write
      id-token: write
  build:
    needs:
      - prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
  gate:
    name: Release gate
    needs:
      - prepare
      - checks
      - build
    if: ${{ always() && needs.prepare.result != 'skipped' && needs.prepare.outputs.channel != 'stable' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = dict.fromkeys(('prepare', 'checks', 'build'), 'success')
          if results.get('prepare', {}).get('outputs', {}).get('status') == 'version-required':
              expected['build'] = 'skipped'
          failed = {name: results.get(name, {}).get('result') for name, result in expected.items() if results.get(name, {}).get('result') != result}
          if failed:
              raise SystemExit(f'Release blocked: {failed}')
          PY
  candidate:
    needs:
      - prepare
      - gate
    if: ${{ needs.prepare.outputs.build == 'true' && needs.prepare.outputs.channel != 'stable' && vars.RELEASE_CHANNELS_ENABLED == 'true' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - &id001
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-assets*
          path: .release-download
          merge-multiple: false
      - run: python3 scripts/release.py collect .release-download .release-assets
      - name: Publish checked candidate
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release_control.py candidate --repo "$GITHUB_REPOSITORY" --channel "$CHANNEL" --version "$VERSION" --sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --assets .release-assets
      - name: Store immutable promotion evidence
        if: ${{ steps.publication.outputs.status != 'superseded' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: .release-evidence/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  stable:
    needs: prepare
    if: ${{ needs.prepare.outputs.channel == 'stable' }}
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - *id001
      - name: Promote RC bytes after approval
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
        run: python3 scripts/release_control.py promote --repo "$GITHUB_REPOSITORY" --rc "$RC_TAG" --run-id "$GITHUB_RUN_ID"
