name: Build Release Candidate
on:
  workflow_call:
    inputs:
      release_plan_artifact:
        required: true
        type: string
      version:
        required: true
        type: string
      channel:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) && (vars.CI_RUNNER_RELEASE_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 45
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Download frozen version plan
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ inputs.release_plan_artifact }}
          path: .
      - name: Apply frozen version plan
        run: python3 scripts/version_plan.py sync --plan .release-plan.json
      - name: Install package build tools
        run: >-
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/requirements-build.txt
      - name: Build complete candidate assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: bash scripts/package-release.sh "$RELEASE_VERSION" "$RELEASE_CHANNEL"
      - name: Enable emulation for ARM64 builds
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - name: Set up container builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          version: v0.37.2
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - name: Export container without publishing a registry tag
        run: bash scripts/package-container.sh
      - name: Verify all packaged checksums
        working-directory: release-dist
        run: sha256sum --check SHA256SUMS
      - name: Verify metadata and bind all payloads to the build inputs
        run: python3 scripts/stage_release_assets.py --target package --pattern "release-dist/*"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-assets
          path: release-assets/package/*
          if-no-files-found: error
          retention-days: 30
