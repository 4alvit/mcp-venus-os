version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # The generated fuzz wrapper, runtime input and release policy share one SHA.
    # Update them together through the release generator, not as a lone action.
    ignore:
      - dependency-name: victron-venus/venus-os-ci-toolkit/.github/workflows/fuzz.yml

    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    groups:
      python-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
