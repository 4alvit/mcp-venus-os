services:
  mcp-venus-os:
    build: .
    image: ghcr.io/4alvit/mcp-venus-os:latest
    env_file: .env
    environment:
      SERVER_TRANSPORT: http
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8000"
      # Cerbo SSH key mounted below; drop the two lines + volume to use
      # SSH_PASSWORD from .env instead
      SSH_KEY_PATH: /app/keys/cerbo_rsa
    volumes:
      # Private key for the SSH management tools (owned by uid 999, mode 600)
      - ./keys:/app/keys:ro
    ports:
      # Host port may need remapping (e.g. "8080:8000" when 8000 is taken)
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      # Any HTTP response from /mcp (incl. 401/406 without MCP headers or
      # auth token) proves the process is up and listening. Literal block (|),
      # not folded (>-): python -c needs real newlines for try/except.
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request as u, urllib.error as e
          try:
              r = u.urlopen("http://127.0.0.1:8000/mcp", timeout=3)
              sys.exit(0 if r.status < 500 else 1)
          except e.HTTPError as ex:
              sys.exit(0 if ex.code < 500 else 1)
      interval: 30s
      # Host can stall several seconds under load (2-core NAS also running
      # frigate); 5s timed out even though the server answers fine.
      timeout: 10s
      retries: 3
      start_period: 15s
